<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cinema Diary</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js"></script>
  <script defer src="vendor/alpine-3.17.5.min.js"></script>
</head>
<body x-data="app" x-cloak>

  <header>
    <h1>Cinema Diary</h1>
    <template x-if="token">
      <nav>
        <span class="muted" x-text="user?.email"></span>
        <button class="link" @click="logout()">Log out</button>
      </nav>
    </template>
  </header>

  <p class="error" x-show="error" x-text="error"></p>

  <!-- Login -->
  <template x-if="!token">
    <form class="card login" @submit.prevent="login()">
      <h2>Log in</h2>
      <label>Email <input type="email" x-model="email" autocomplete="username" required></label>
      <label>Password <input type="password" x-model="password" autocomplete="current-password" required></label>
      <button type="submit" :disabled="busy" x-text="busy ? 'Logging in…' : 'Log in'"></button>
      <p class="muted small">Invite-only. Ask the admin for an account.</p>
    </form>
  </template>

  <!-- My list -->
  <template x-if="token">
    <main>
      <h2>My list</h2>
      <p class="muted" x-show="!busy && picks.length === 0">
        No picks yet. Run <code>uv run python -m cinema_diary.curate</code>
        (onboarding in the app comes next).
      </p>
      <ol class="picks">
        <template x-for="p in picks" :key="p.id">
          <li class="card pick">
            <div class="poster">
              <img :src="poster(p.movie)" :alt="p.movie.title" x-show="p.movie.poster_path" loading="lazy">
            </div>
            <div>
              <h3>
                <span x-text="p.movie.title"></span>
                <span class="muted" x-text="p.movie.year ? '(' + p.movie.year + ')' : ''"></span>
              </h3>
              <p class="reasons">
                <template x-for="r in p.reasons" :key="r">
                  <span class="tag" x-text="r"></span>
                </template>
              </p>
              <p class="muted small" x-text="'Score ' + p.score"></p>
            </div>
          </li>
        </template>
      </ol>
    </main>
  </template>

  <footer class="muted small">
    Movie data and images from TMDB. This product uses the TMDB API but is not
    endorsed or certified by TMDB.
  </footer>
</body>
</html>
