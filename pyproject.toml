[project]
name = "cinema-diary"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "krishnayeddula", email = "krishnayeddula@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
